<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16100B" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Toilet Finder</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/Nunito_800ExtraBold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Map of nearby toilets"></div>

<div class="top">
  <header class="brand">
    <button type="button" class="logo-btn" id="logo" aria-label="Toilet Finder logo"><img class="logo" src="icons/logo.svg" alt="" width="36" height="36"></button>
    <div class="brand-text">
      <h1>Toilet Finder</h1>
      <div id="status" role="status"><span class="dot"></span><span id="statusText"></span></div>
    </div>
    <button type="button" id="retry" class="btn-mini" hidden>Retry</button>
  </header>
  <div class="chips" role="group" aria-label="Filters">
    <button type="button" class="chip" data-filter="open" aria-pressed="false">Open now</button>
    <button type="button" class="chip" data-filter="accessible" aria-pressed="false"><span class="chip-ico" data-icon="accessible"></span>Accessible</button>
    <button type="button" class="chip" data-filter="urinals" aria-pressed="false"><span class="chip-ico" data-icon="urinal"></span>Urinals</button>
    <button type="button" id="searchArea" class="chip ghost">Search this area</button>
  </div>
</div>

<button type="button" id="locate" class="fab" aria-label="Go to my location"><span class="target"></span></button>

<section id="panel" class="panel" data-snap="half" aria-label="Nearest toilets">
  <div class="panel-head" id="panelHead">
    <div class="grab" aria-hidden="true"></div>
    <div class="panel-title">
      <h2 id="listTitle">Nearest toilets</h2>
      <p id="listSub">Open first, then cleanest, then closest</p>
    </div>
  </div>
  <div class="panel-body">
    <ul id="list"></ul>
    <p class="foot">Data © OpenStreetMap contributors. Ratings and any hours you add stay on this device. <a href="#" id="diagLink">Data status</a></p>
  </div>
</section>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-inner" role="dialog" aria-modal="true" aria-label="Toilet details">
    <button id="closeSheet" class="close" aria-label="Close">×</button>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="lib/hours.js"></script>
<script src="lib/rank.js"></script>
<script src="lib/facilities.js"></script>
<script src="lib/data.js"></script>
<script src="lib/icons.js"></script>
<script src="lib/present.js"></script>
<script src="lib/overpass.js"></script>
<script src="lib/imagery.js"></script>
<script src="app.js"></script>
</body>
</html>
